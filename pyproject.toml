[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physica"
version = "0.3.0"
description = "Reproducible physics simulation, differentiable dynamics, and physics-informed learning"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
learn = ["torch>=2.2"]
test = ["pytest>=8"]
reference = ["scipy>=1.12"]
inverse = ["numpy>=1.26", "scipy>=1.12"]
all = ["torch>=2.2", "pytest>=8", "numpy>=1.26", "scipy>=1.12"]

[project.scripts]
physica = "physica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
